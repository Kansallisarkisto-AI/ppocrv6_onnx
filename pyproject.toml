[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppocrv6-onnx"
version = "0.1.0"
description = "Pure ONNX Runtime implementation of PP-OCRv6 text detection & recognition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.21",
    "pyclipper>=1.3",
]

[tool.setuptools]
py-modules = ["ppocrv6_onnx"]
packages = ["models"]

[tool.setuptools.package-data]
models = ["*.txt"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
coreml = ["onnxruntime-coreml"]
cpu = ["onnxruntime>=1.28"]
openvino = ["onnxruntime-openvino>=1.28"]
gpu = ["onnxruntime-gpu>=1.20"]
coreml = ["onnxruntime-coreml"]

[project.urls]
Repository = "https://github.com/Kansallisarkisto-AI/ppocrv6_onnx"
